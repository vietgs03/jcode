name: Kiro Verify (temporary)

on:
  push:
    branches: [ci/kiro-verify]

concurrency:
  group: kiro-verify
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  RUSTUP_TOOLCHAIN: stable

jobs:
  verify:
    name: verify (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: branch
            ref: ""
          - label: baseline-master
            ref: 5bc6cf6b9f405c63525743658d29db945dcb6e73
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: kiro-verify-${{ matrix.label }}
          cache-on-failure: "true"

      - name: clippy --no-deps -D warnings (affected crates)
        continue-on-error: true
        run: |
          set +e
          pkgs="-p jcode-provider-core -p jcode-provider-metadata -p jcode-base -p jcode-tui -p jcode"
          if [ -d crates/jcode-provider-kiro ]; then pkgs="$pkgs -p jcode-provider-kiro"; fi
          cargo clippy --locked --no-deps --all-targets --message-format=short $pkgs -- -D warnings > clippy.log 2>&1
          echo "clippy exit: $?"
          grep -E "^(crates|src)/[^ ]+: (error|warning)" clippy.log | sort | uniq | head -80

      - name: full test suites
        continue-on-error: true
        run: |
          set +e
          run() {
            label="$1"; shift
            "$@" > "test-$label.log" 2>&1
            echo "== $label exit=$?"
            grep -E "^test result|^test .* FAILED" "test-$label.log" | head -60
          }
          run provider-crates cargo test --locked -p jcode-provider-core -p jcode-provider-metadata
          run base cargo test --locked -p jcode-base --lib
          run tui cargo test --locked -p jcode-tui --lib
          run cli cargo test --locked -p jcode --lib
          run auth-login-flow cargo test --locked -p jcode --test auth_login_flow
          run provider-matrix cargo test --locked -p jcode --test provider_matrix

      - name: isolated re-runs of suspected flaky tests
        continue-on-error: true
        run: |
          set +e
          cargo test --locked -p jcode-tui --lib -- --exact tui::app::tests::test_agent_model_picker_inherit_row_uses_provider_default_when_inherited_model_is_unknown 2>&1 | grep -E "^test |test result"
          cargo test --locked -p jcode-base --lib -- --exact provider_catalog::provider_catalog_tests::named_provider_profile_reports_malformed_config_instead_of_unknown_profile 2>&1 | grep -E "^test |test result"
          cargo test --locked -p jcode-base --lib -- --exact provider_catalog::provider_catalog_tests::newest_release_picker_uses_recency_within_a_tier 2>&1 | grep -E "^test |test result"
