name: Kiro Verify (temporary)

on:
  push:
    branches: [ci/kiro-verify]

concurrency:
  group: kiro-verify
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  RUSTUP_TOOLCHAIN: stable

jobs:
  verify:
    name: verify (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: branch
            ref: ""
          - label: baseline-master
            ref: 5bc6cf6b9f405c63525743658d29db945dcb6e73
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: kiro-verify
          cache-on-failure: "true"

      - name: cargo check (all targets of affected crates)
        run: |
          cargo check --locked --all-targets --message-format=short \
            -p jcode-provider-core -p jcode-provider-metadata \
            -p jcode-base -p jcode-tui -p jcode 2>&1 | tail -5

      - name: clippy -D warnings (affected crates)
        continue-on-error: true
        run: |
          set +e
          cargo clippy --locked --all-targets --message-format=short \
            -p jcode-provider-core -p jcode-provider-metadata \
            -p jcode-base -p jcode-tui -p jcode -- -D warnings > clippy.log 2>&1
          echo "clippy exit: $?"
          grep -E "^(crates|src)/[^ ]+: (error|warning)" clippy.log | sort | uniq | head -60

      - name: tests
        continue-on-error: true
        run: |
          set +e
          run() {
            label="$1"; shift
            "$@" > "test-$label.log" 2>&1
            echo "== $label exit=$?"
            grep -E "^test result|^test .* FAILED" "test-$label.log" | head -40
            awk '/^---- .* stdout ----$/{p=1; n=0} p{print; n++; if (n>14) {p=0}}' "test-$label.log" | head -150
          }
          run provider-crates cargo test --locked -p jcode-provider-core -p jcode-provider-metadata
          run base cargo test --locked -p jcode-base --lib -- provider:: auth:: provider_catalog
          run cli cargo test --locked -p jcode --lib -- provider_init auth_test login commands
          run auth-login-flow cargo test --locked -p jcode --test auth_login_flow
          run tui cargo test --locked -p jcode-tui --lib -- login provider picker

      - name: tests (Kiro crate, branch only)
        if: matrix.label == 'branch'
        run: cargo test --locked -p jcode-provider-kiro 2>&1 | grep -E "^test result|FAILED|panicked"
